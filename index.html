<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marco digital</title>
<style>
:root{
  --ink:#12161d; --paper:#ecebe6; --brass:#b8a06a; --pill:rgba(18,22,29,.74); --line:rgba(236,235,230,.28);
  --d:6s; --bar:52px; color-scheme:light dark; box-sizing:border-box;
}
html[data-theme=dark]{color-scheme:dark}
html[data-theme=dark],html[data-theme=dark] body{background:#12161d}
html[data-theme=light]{color-scheme:light;--paper:#1c1f26;--pill:rgba(255,255,255,.85);--line:rgba(18,22,29,.2)}
html[data-theme=light],html[data-theme=light] body{background:#f4f3ef}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:transparent;color:var(--paper);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{position:relative}

/* Área del marco: todo el espacio menos la franja de controles */
#area{position:absolute;left:0;right:0;top:0;bottom:var(--bar);padding:10px;
  display:flex;align-items:center;justify-content:center;container-type:size}
body:has(#empty:not(.hide)) #area{visibility:hidden}
#stage{position:relative;flex:none;overflow:hidden;isolation:isolate;
  width:min(100cqw,100cqh);aspect-ratio:1;border-radius:min(8cqw,8cqh);
  box-shadow:0 0 0 1px rgba(128,128,128,.25),0 12px 40px rgba(0,0,0,.28);transition:border-radius .5s ease}
body[data-shape=vertical] #stage{aspect-ratio:3/4;width:min(100cqw,75cqh)}
body[data-shape=horizontal] #stage{aspect-ratio:3/2;width:min(100cqw,150cqh)}
body[data-shape=circle] #stage{border-radius:50%}

.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.on .fg.kb{animation:drift calc(var(--d) + 1.2s) ease-out forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.slide.on .fg.kb{animation:none}.slide{transition-duration:.01s}}

#empty{position:absolute;left:0;right:0;top:0;bottom:var(--bar);display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
#empty.hide{display:none}
#drop{width:min(520px,100%);padding:32px 20px;border:1.5px dashed var(--brass);border-radius:12px;
  background:var(--pill);backdrop-filter:blur(6px);transition:background .2s}
#drop.over{background:rgba(60,52,30,.85)}
#drop h1{margin:0 0 8px;font-size:clamp(20px,4.5vw,32px);font-weight:600;letter-spacing:-.01em}
#drop p{margin:0 0 20px;opacity:.8;line-height:1.5;font-size:14px}

button,select,label.btn{font:inherit;font-size:13px;color:var(--paper);background:var(--pill);border:1px solid var(--line);
  border-radius:999px;padding:0 12px;height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  flex:none;white-space:nowrap;position:relative;backdrop-filter:blur(6px)}
button:hover,select:hover,label.btn:hover{border-color:var(--brass)}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--brass);outline-offset:2px}
button[aria-pressed=false]{opacity:.6}
.primary{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600;height:40px;padding:0 22px}
select{appearance:none}
select option{background:Canvas;color:CanvasText}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}

/* Franja de controles: ocupa su propio espacio, nunca tapa la foto */
#bar{position:absolute;left:0;right:0;bottom:0;height:var(--bar);display:flex;align-items:center;
  justify-content:safe center;gap:6px;padding:0 10px 4px;overflow-x:auto;scrollbar-width:none;transition:opacity .4s}
#bar::-webkit-scrollbar{display:none}
body.idle #bar{opacity:0;pointer-events:none}
body.idle{cursor:none}
#count{flex:none;min-width:48px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;
  padding:0 10px;height:32px;line-height:32px;border-radius:999px;background:var(--pill)}
#progress{display:none}
#progress i{display:block;height:100%;width:0;background:var(--brass)}
#progress i.run{animation:fill var(--d) linear forwards}
#progress.paused i{animation-play-state:paused}
@keyframes fill{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div id="area">
  <div id="stage">
    <div class="slide" id="s0"><img class="fg" alt=""></div>
    <div class="slide" id="s1"><img class="fg" alt=""></div>
  </div>
</div>

<section id="empty">
  <div id="drop">
    <h1>Tu marco está vacío</h1>
    <p>Arrastra tus fotos aquí o elígelas desde tu dispositivo. Cambiarán solas, una tras otra.</p>
    <label class="btn primary">Elegir fotos<input type="file" id="pick0" accept="image/*" multiple></label>
  </div>
</section>

<div id="bar" role="toolbar" aria-label="Controles del marco">
  <button id="prev" aria-label="Foto anterior">‹</button>
  <button id="play" aria-label="Pausar">Pausar</button>
  <button id="next" aria-label="Foto siguiente">›</button>
  <span id="count" aria-live="polite">0 / 0</span>
  <select id="speed" aria-label="Tiempo por foto">
    <option value="3">3 s</option><option value="6" selected>6 s</option><option value="10">10 s</option>
    <option value="30">30 s</option><option value="60">1 min</option>
  </select>
  <select id="shape" aria-label="Forma del marco">
    <option value="square" selected>Cuadrado</option><option value="vertical">Vertical</option>
    <option value="horizontal">Horizontal</option><option value="circle">Redondo</option>
  </select>
  <select id="theme" aria-label="Fondo">
    <option value="transparent" selected>Transparente</option><option value="dark">Oscuro</option><option value="light">Claro</option>
  </select>
  <button id="kb" aria-pressed="true" title="Zoom suave">Zoom</button>
  <label class="btn" title="Añadir fotos">Añadir<input type="file" id="pick1" accept="image/*" multiple></label>
  <button id="del" title="Quitar la foto actual">Quitar</button>
  <button id="save" title="Guardar con fotos: descarga un archivo nuevo con tus fotos incluidas">Guardar</button>
  <button id="fs" aria-label="Pantalla completa" title="Pantalla completa">⤢</button>
</div>
<div id="progress" aria-hidden="true"><i></i></div>
<script type="application/json" id="seed">[]</script>

<script>
(function(){
  var SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  var photos=[], cur=-1, front=0, playing=true, timer=null, kbOn=true, idleT=null, shuffled=false;
  var $=function(s){return document.querySelector(s)};
  var slides=[$('#s0'),$('#s1')], bar=$('#progress i'), prog=$('#progress');
  var root=document.documentElement;

  function dur(){return parseFloat($('#speed').value)}
  function setVars(){root.style.setProperty('--d',dur()+'s')}

  function restartBar(){
    bar.classList.remove('run'); void bar.offsetWidth;
    if(photos.length>1) bar.classList.add('run');
    prog.classList.toggle('paused',!playing);
  }
  function schedule(){
    clearTimeout(timer);
    if(playing && photos.length>1) timer=setTimeout(function(){go(1)},dur()*1000);
  }
  function show(i){
    if(!photos.length){cur=-1;$('#empty').classList.remove('hide');slides.forEach(function(s){s.classList.remove('on')});
      $('#count').textContent='0 / 0';bar.classList.remove('run');clearTimeout(timer);return}
    $('#empty').classList.add('hide');
    cur=(i+photos.length)%photos.length;
    var next=slides[1-front], old=slides[front];
    var url=photos[cur];
    next.querySelectorAll('img').forEach(function(im){im.src=url});
    var fg=next.querySelector('.fg');
    fg.classList.remove('kb'); void fg.offsetWidth; fg.classList.toggle('kb',kbOn);
    next.classList.add('on'); old.classList.remove('on');
    front=1-front;
    $('#count').textContent=(cur+1)+' / '+photos.length;
    setVars(); restartBar(); schedule();
  }
  function go(n){show(cur+n)}

  function toData(file){
    return new Promise(function(res){
      var u=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var m=1400, k=Math.min(1,m/Math.max(im.width,im.height)), c=document.createElement('canvas');
        c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        var x=c.getContext('2d'); x.fillStyle='#12161d'; x.fillRect(0,0,c.width,c.height);
        x.drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.8));
      };
      im.onerror=function(){URL.revokeObjectURL(u);res(null)};
      im.src=u;
    });
  }
  function idb(mode,fn){
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open('marco-digital',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('k')};
        r.onsuccess=function(){
          var t=r.result.transaction('k',mode), q=fn(t.objectStore('k'));
          t.oncomplete=function(){res(q&&q.result)}; t.onerror=rej;
        };
        r.onerror=rej;
      }catch(e){rej(e)}
    });
  }
  function persist(){idb('readwrite',function(s){s.put(photos,'photos')}).catch(function(){})}
  function applyTheme(v){root.dataset.theme=v}
  function applyOpts(o){
    if(o.shape){$('#shape').value=o.shape; document.body.dataset.shape=o.shape}
    if(o.speed){$('#speed').value=o.speed; setVars()}
    if(typeof o.kb==='boolean'){kbOn=o.kb; $('#kb').setAttribute('aria-pressed',kbOn)}
    var t=o.theme||'transparent'; $('#theme').value=t; applyTheme(t);
  }
  $('#theme').onchange=function(){applyTheme(this.value)};
  function exportFile(){
    if(!photos.length) return;
    var html=SRC.replace(/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+JSON.stringify({photos:photos,opts:{shape:$('#shape').value,speed:$('#speed').value,kb:kbOn,theme:$('#theme').value}})+b});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='marco-digital-con-fotos.html';
    document.body.appendChild(a); a.click(); a.remove();
    var b=$('#save'), t=b.textContent; b.textContent='Descargado'; setTimeout(function(){b.textContent=t},2000);
  }
  $('#save').onclick=exportFile;
  function addFiles(list){
    var files=Array.prototype.filter.call(list,function(f){return /^image\//.test(f.type)});
    if(!files.length) return;
    var first=photos.length===0;
    Promise.all(files.map(toData)).then(function(out){
      out.forEach(function(d){if(d) photos.push(d)});
      if(!photos.length) return;
      if(first) show(0); else {$('#count').textContent=(cur+1)+' / '+photos.length; restartBar(); schedule();}
      persist();
    });
    
  }

  ['#pick0','#pick1'].forEach(function(id){
    $(id).addEventListener('change',function(e){addFiles(e.target.files);e.target.value=''});
  });
  var drop=$('#drop');
  ['dragenter','dragover'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
  document.addEventListener('drop',function(e){if(e.dataTransfer) addFiles(e.dataTransfer.files)});

  $('#prev').onclick=function(){go(-1)};
  $('#next').onclick=function(){go(1)};
  $('#play').onclick=togglePlay;
  function togglePlay(){
    playing=!playing;
    $('#play').textContent=playing?'Pausar':'Reanudar';
    $('#play').setAttribute('aria-label',playing?'Pausar':'Reanudar');
    if(playing){ if(cur>=0){restartBar();schedule();} } else {clearTimeout(timer);prog.classList.add('paused')}
  }
  $('#speed').onchange=function(){setVars(); if(cur>=0){restartBar();schedule()}};
  $('#shape').onchange=function(){document.body.dataset.shape=this.value};
  $('#kb').onclick=function(){
    kbOn=!kbOn; $('#kb').setAttribute('aria-pressed',kbOn);
    var fg=slides[front].querySelector('.fg'); fg.classList.toggle('kb',kbOn);
  };
  $('#del').onclick=function(){
    if(cur<0) return;
    photos.splice(cur,1); persist();
    if(photos.length) show(Math.min(cur,photos.length-1)); else show(0);
  };
  $('#fs').onclick=function(){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(root.requestFullscreen) root.requestFullscreen().catch(function(){});
  };

  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='SELECT') return;
    if(e.key==='ArrowRight') go(1);
    else if(e.key==='ArrowLeft') go(-1);
    else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePlay()}
    else if(e.key==='f'||e.key==='F') $('#fs').click();
  });

  function wake(){
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT=setTimeout(function(){if(photos.length) document.body.classList.add('idle')},3500);
  }
  ['mousemove','touchstart','keydown','click'].forEach(function(t){document.addEventListener(t,wake,{passive:true})});
  wake(); setVars();
  var seed=[]; try{seed=JSON.parse($('#seed').textContent||'[]')}catch(e){}
  var opts={}; if(!Array.isArray(seed)){opts=seed.opts||{}; seed=seed.photos||[]}
  applyOpts(opts);
  if(seed.length){photos=seed.slice(); show(0)}
  else idb('readonly',function(s){return s.get('photos')}).then(function(v){if(v&&v.length&&!photos.length){photos=v; show(0)}}).catch(function(){});
})();
</script>
</body>
</html>
